<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; }

        /* The 3x3 Grid */
        .board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-template-rows: repeat(3, 100px);
            gap: 5px;
            background-color: #333;
            padding: 5px;
            border-radius: 8px;
        }

        /* Individual Squares */
        .cell {
            width: 100px;
            height: 100px;
            background-color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            font-weight: bold;
            cursor: pointer;
        }

        .cell:hover { background-color: #f0f0f0; }

        #status { margin-top: 20px; font-size: 1.2rem; }
    </style>

</head>
<body>

    <h1>Tic Tac Toe</h1>

    <div class="board" id="board">
        <div class="cell" id="0-0"></div>
        <div class="cell" id="0-1"></div>
        <div class="cell" id="0-2"></div>
        <div class="cell" id="1-0"></div>
        <div class="cell" id="1-1"></div>
        <div class="cell" id="1-2"></div>
        <div class="cell" id="2-0"></div>
        <div class="cell" id="2-1"></div>
        <div class="cell" id="2-2"></div>
    </div>

    <div id="status">Player X's Turn</div>
    <button onclick="location.reload()" style="margin-top: 10px;">Reset Game</button>

<script>
    let currentPlayer = 'X';
    let gameActive = true;
    const statusDisplay = document.getElementById('status');

    // Select all cells in the grid
    document.querySelectorAll('.cell').forEach(cell => {
        cell.addEventListener('click', function() {
            // If the game is over or the cell is already filled, do nothing
            if (!gameActive || this.innerText !== '') return;

            // 1. Get coordinates from the ID (e.g., "0-1" becomes row 0, col 1)
            const idParts = this.id.split('-');
            const row = idParts[0];
            const col = idParts[1];

            // 2. Send the move to the Flask Python backend
            fetch('/move', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    row: row,
                    col: col
                }),
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === "error") {
                    alert(data.message);
                    return;
                }

                // 3. Update the UI with the player's mark
                this.innerText = currentPlayer;
                this.style.color = currentPlayer === 'X' ? '#e74c3c' : '#3498db';

                // 4. Handle the Game Result
                if (data.status === "win") {
                    statusDisplay.innerText = `Player ${currentPlayer} Wins! 🎉`;
                    statusDisplay.style.color = "green";
                    gameActive = false;
                }
                else if (data.status === "draw") {
                    statusDisplay.innerText = "It's a Draw! 🤝";
                    gameActive = false;
                }
                else {
                    // 5. Switch Player locally for the next click
                    currentPlayer = (data.next_player === 1) ? 'X' : 'O';
                    statusDisplay.innerText = `Player ${currentPlayer}'s Turn`;
                }
            })
            .catch(error => {
                console.error('Error:', error);
            });
        });
    });
</script>
</body>
</html>
