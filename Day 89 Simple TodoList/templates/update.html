{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h3 class="card-title text-center mb-4">Update Todo</h3>
                <form action="{{ url_for('update_todo', todoid=todo.id) }}" method="POST">
                    <div class="mb-3">
                        <label for="content" class="form-label">Todo Task</label>
                        <input type="text" class="form-control" id="content" name="content" value="{{ todo.content }}" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Save Changes</button>
                    <div class="text-center mt-3">
                        <a href="{{ url_for('get_all_todo') }}" class="text-decoration-none">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
