<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF to Audio Book Converter</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="glass-container">
        <h1>Transform PDFs into Audiobooks</h1>
        <p class="subtitle">Listen to your documents, articles, and books on the go.</p>
        
        <form action="/convert" method="POST" enctype="multipart/form-data" id="uploadForm">
            <div class="file-upload-wrapper" id="dropArea">
                <input type="file" name="pdf_file" id="pdfFile" accept="application/pdf" class="file-input">
                <div class="upload-content">
                    <svg class="upload-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                    <span class="upload-text">Drag & drop your PDF here or <span class="highlight">browse</span></span>
                    <span class="file-name" id="fileName"></span>
                </div>
            </div>

            <div class="options-container">
                <label for="languageSelect">Language (Optional):</label>
                <select name="language" id="languageSelect">
                    <option value="auto">Auto Detect (Recommended)</option>
                    <option value="en">English</option>
                    <option value="es">Spanish</option>
                    <option value="fr">French</option>
                    <option value="de">German</option>
                    <option value="hi">Hindi</option>
                    <option value="ar">Arabic</option>
                    <option value="zh">Chinese</option>
                </select>
                <small>Select a language if automatic detection fails.</small>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">
                <span class="btn-text">Convert to Audio</span>
                <span class="loader" id="loader" style="display: none;"></span>
            </button>
        </form>

        <div id="resultContainer" class="result-container" style="display: none;">
            <h2>Your Audiobook is Ready!</h2>
            <audio controls id="audioPlayer" class="audio-player">
                <source src="" type="audio/mpeg">
                Your browser does not support the audio element.
            </audio>
            <br>
            <a href="/" class="restart-btn">Convert Another</a>
        </div>
        
        <!-- Error Message Container -->
        <div id="errorContainer" class="error-container" style="display: none;">
            <p id="errorMessage"></p>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('pdfFile');
        const fileNameDisplay = document.getElementById('fileName');
        const uploadText = document.querySelector('.upload-text');

        // Show file name after selection
        fileInput.addEventListener('change', function(e) {
            if(fileInput.files.length > 0) {
                fileNameDisplay.textContent = fileInput.files[0].name;
                uploadText.style.display = 'none';
            } else {
                fileNameDisplay.textContent = '';
                uploadText.style.display = 'block';
            }
        });

        const uploadForm = document.getElementById('uploadForm');
        // Handle background submission and UI state
        uploadForm.addEventListener('submit', async function(e) {
            e.preventDefault(); // Prevent page reload
            
            const submitBtn = document.getElementById('submitBtn');
            const loader = document.getElementById('loader');
            const btnText = document.querySelector('.btn-text');
            const resultContainer = document.getElementById('resultContainer');
            const errorContainer = document.getElementById('errorContainer');
            const audioPlayer = document.getElementById('audioPlayer');
            
            // UI State updating
            btnText.style.display = 'none';
            loader.style.display = 'inline-block';
            submitBtn.disabled = true;
            errorContainer.style.display = 'none';
            resultContainer.style.display = 'none';

            const formData = new FormData(uploadForm);
            
            if(!fileInput.files.length) {
                document.getElementById('errorMessage').textContent = "Please select a PDF file first!";
                errorContainer.style.display = 'block';
                btnText.style.display = 'inline';
                loader.style.display = 'none';
                submitBtn.disabled = false;
                return;
            }

            try {
                // Send background request to our Flask app
                const response = await fetch('/convert', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if(response.ok && !data.error) {
                    // Update audio source and display player
                    audioPlayer.src = data.audio_url;
                    resultContainer.style.display = 'block';
                    uploadForm.style.display = 'none';
                } else {
                    document.getElementById('errorMessage').textContent = data.error || "An error occurred during conversion.";
                    errorContainer.style.display = 'block';
                }
            } catch(error) {
                document.getElementById('errorMessage').textContent = "Failed to connect to the server.";
                errorContainer.style.display = 'block';
            } finally {
                btnText.style.display = 'inline';
                loader.style.display = 'none';
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
